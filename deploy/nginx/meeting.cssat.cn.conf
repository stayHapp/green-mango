# HTTP 80端口：跳转HTTPS
server {
    if ($host = meeting.cssat.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name meeting.cssat.cn;

    location /.well-known/acme-challenge/ {
        root /opt/zhihui-demo/app/frontend/dist;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 443 主站点
server {
    listen 443 ssl;
    server_name meeting.cssat.cn;
    root /opt/zhihui-demo/app/frontend/dist;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/meeting.cssat.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/meeting.cssat.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # API反代到后端容器
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 带版本号的构建产物可永久缓存，文件更新时 URL 会自动变化
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 前端静态文件
    location / {
        try_files $uri $uri/ /index.html;
        # 首页始终回源校验，保证新版本发布后立即生效
        add_header Cache-Control "no-cache";
    }
}
